<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel - E-Shop</title>
    <meta name="description" content="E-Shop WhatsApp — Gestiona tu catálogo, pedidos y ventas desde un solo panel de control." />
    <meta name="theme-color" content="#004ac6" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="E-Shop WhatsApp — Panel de Control" />
    <meta property="og:description" content="Gestiona tu catálogo, pedidos y ventas desde un solo panel. La solución más rápida para vender por WhatsApp." />
    <meta property="og:site_name" content="E-Shop WhatsApp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Shop WhatsApp — Panel de Control" />
    <meta name="twitter:description" content="Gestiona tu catálogo, pedidos y ventas desde un solo panel." />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ── Premium global styles ── */
        *, *::before, *::after { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.25);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.55); }

        /* Premium text selection */
        ::selection {
            background: rgba(99, 102, 241, 0.22);
            color: inherit;
        }

        /* Prevent layout shift before React mounts */
        #root { min-height: 100vh; }

        /* Smooth all transitions globally */
        a { transition: color 0.15s ease, opacity 0.15s ease; }

        /* Premium focus ring */
        :focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.6);
            outline-offset: 2px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
