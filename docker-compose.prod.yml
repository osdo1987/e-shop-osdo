version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eshop_api_prod
    restart: always
    environment:
      # Ahora usa directamente lo que hay en el archivo .env del servidor
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - eshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eshop_frontend_prod
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - eshop_network
      - osdosoft_public

volumes:
  uploads_data:

networks:
  eshop_network:
    driver: bridge
  osdosoft_public:
    external: true