services:
  db:
    image: postgres:15
    container_name: e_shop_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-e_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5435"

  api:
    build: .
    container_name: e_shop_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-e_shop}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key}
      FLASK_ENV: development
    volumes:
      - .:/app
    ports:
      - "5002:5000"
    depends_on:
      - db

volumes:
  postgres_data: